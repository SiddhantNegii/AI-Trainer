databases:
  - name: ai-trainer-db
    plan: free
    databaseName: fitness_db
    user: fitness_user

services:
  - type: web
    name: ai-trainer-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: ai-trainer-db
          property: connectionString
      - key: FRONTEND_HOST
        fromService:
          type: web
          name: ai-trainer-frontend
          property: host
      - key: SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: EXERCISEDB_API_HOST
        value: exercisedb-api1.p.rapidapi.com
      # Set these manually in the Render dashboard (do not commit real values):
      # - key: EXERCISEDB_API_KEY
      # - key: SPOONACULAR_API_KEY

  - type: web
    name: ai-trainer-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_HOST
        fromService:
          type: web
          name: ai-trainer-backend
          property: host
