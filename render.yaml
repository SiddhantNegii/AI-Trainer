services:
  # Backend Service
  - type: web
    name: ai-fitness-backend
    env: python
    region: ohio # or your preferred region
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: ai-fitness-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: EXERCISEDB_API_KEY
        sync: false # User must provide this
      - key: EXERCISEDB_API_HOST
        value: exercisedb-api1.p.rapidapi.com
      - key: SPOONACULAR_API_KEY
        sync: false # User must provide this
      - key: FRONTEND_URL
        value: https://ai-fitness-frontend.onrender.com # Update after frontend deploy

  # Frontend Service
  - type: web
    name: ai-fitness-frontend
    env: node
    region: ohio
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: ai-fitness-backend
          property: url

databases:
  - name: ai-fitness-db
    databaseName: fitness_db
    user: fitness_user
    plan: free # Optional: specify plan
